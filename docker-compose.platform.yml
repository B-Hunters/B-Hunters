# The B-Hunters platform on the tailnet.
#
# The platform is reachable at http://bhunter.<tailnet>.ts.net:8080 from
# every device on the tailnet, and is not published on the host's public
# interfaces.
#
# The Tailscale sidecar is the tailnet node: the platform shares its
# network namespace, so the platform *is* the node named "bhunter".
#
#   docker compose --env-file ../.env -f docker-compose.platform.yml up -d
#
# The scanner worker images are built separately:
#
#   for w in nuclei katana dalfox sqlmap nmap; do
#     docker build -q -t b-hunters-local/$w:1.2.0 ../repos/B-Hunters-${w^}
#   done

x-tailscale: &tailscale
  image: tailscale/tailscale:latest
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
    - SYS_MODULE
  environment:
    - TS_AUTHKEY=${TS_AUTHKEY}
    - TS_STATE_DIR=/var/lib/tailscale
    - TS_USERSPACE=false
    # The platform shares this container's network namespace, so the
    # resolver it sees is the one in /etc/resolv.conf.  With DNS accepted
    # here, tailscaled overwrites that file with MagicDNS and the Docker
    # embedded resolver disappears - and the container names of the
    # database, the artefact store and the laboratory then resolve
    # intermittently, which costs findings.  The platform resolves no
    # tailnet name, so the embedded resolver is what it wants.
    - TS_ACCEPT_DNS=false
  volumes:
    - /dev/net/tun:/dev/net/tun

services:
  # --- the tailnet node ------------------------------------------------
  tailscale-bhunter:
    <<: *tailscale
    container_name: bhunter_ts
    hostname: ${BHUNTER_TS_HOSTNAME:-bhunter}
    volumes:
      - ts_bhunter_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    networks:
      - bhunter

  # --- the platform: the API, the web console and the agent runtime ----
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: b-hunters-platform:1.2.0
    container_name: bhunter_platform
    # Share the tailnet node's network namespace, so the platform is the
    # node named "bhunter" and is reachable over the tailnet.
    network_mode: service:tailscale-bhunter
    depends_on:
      - tailscale-bhunter
      - mongo
      - redis
      - s3
    restart: unless-stopped
    environment:
      - BHUNTERS_HOST=0.0.0.0
      - BHUNTERS_PORT=80
      - BHUNTERS_BASE_URL=http://${BHUNTER_TS_HOSTNAME:-bhunter}
      - BHUNTERS_MONGO_URI=mongodb://bhunter:bhunter_dev_pw@mongo:27017/?authSource=admin
      - BHUNTERS_MONGO_DB=b-hunters
      - BHUNTERS_KARTON_CONFIG_PATH=/etc/b-hunters/b-hunters.ini
      - BHUNTERS_AGENT_WORKSPACE_ROOT=/var/lib/b-hunters/workspaces
      - BHUNTERS_SESSION_COOKIE_SECURE=false
      - BHUNTERS_CORS_ORIGINS=
      # The model provider.  The credentials come from the environment
      # file, never from the database and never from source control.  The
      # agent roles fall back to this configuration when no provider has
      # been registered by name.
      - BHUNTERS_LLM_NAME=${MINIMAX_NAME:-minimax}
      - BHUNTERS_LLM_BASE_URL=${MINIMAX_HOST}
      - BHUNTERS_LLM_API_KEY=${MINIMAX_KEY}
      - BHUNTERS_LLM_MODEL=${MINIMAX_MODEL:-MINIMAX-M3.1-flash}
      - BHUNTERS_LLM_MAX_OUTPUT_TOKENS=8192
      - BHUNTERS_LLM_TIMEOUT=300
      # The agent budgets.  A reasoning model needs a larger token budget
      # than the roles declare: it spends a large part of every turn on
      # reasoning and the prompt grows with every tool result.
      # The independent verifier re-checks every candidate finding, which
      # costs one request each.  It is off unless it is asked for: set
      # this to true, or use the checkbox on the scan form.
      - BHUNTERS_AGENT_VERIFICATION_ENABLED=${BHUNTERS_AGENT_VERIFICATION_ENABLED:-false}
      # A reasoning model spends about 30k tokens a round, so a role that
      # works for twenty rounds needs more than the default.
      - BHUNTERS_AGENT_MAX_TOKENS_PER_TASK=1500000
      # The whole scan has a budget of its own.
      - BHUNTERS_AGENT_MAX_TOKENS_PER_SCAN=12000000
      # The adjudicator records a verdict for every finding it judges, and
      # it ran out of tool calls before it could conclude.  The value is a
      # floor: a role that needs less never uses it.
      - BHUNTERS_AGENT_MAX_TOOL_CALLS_PER_TASK=100
      # Every role used every round it was given and three of them were
      # cut off before they concluded.  The wall clock and the token
      # budget are the real limits.
      - BHUNTERS_AGENT_MAX_ROUNDS=24
      - BHUNTERS_AGENT_WALL_CLOCK_SECONDS=1800
      # A reasoning model spends about 150 seconds and 150,000 tokens on
      # one role, so twelve roles need nine minutes of agent time on
      # their own.  The runner runs the four roles that yield the most
      # and records the rest as cut off, rather than starting twelve roles
      # and finishing none of them.
      - BHUNTERS_AGENT_MAX_ROLES=${BHUNTERS_AGENT_MAX_ROLES:-4}
    volumes:
      # The platform names a Karton identity; the workers do not.
      - ./deploy/platform.ini:/etc/b-hunters/b-hunters.ini:ro
      - workspaces:/var/lib/b-hunters
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- the runner ------------------------------------------------------
  # The runner executes the scans.  It is a separate process from the
  # API on purpose: a scan used to be an asyncio task inside the API,
  # so restarting the API killed the scan with it.  The runner claims a
  # job from the MongoDB queue, holds a lease on it, heartbeats that
  # lease while it works, and picks the scan up again where it left off
  # when it is restarted.
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: b-hunters-platform:1.2.0
    container_name: bhunter_runner
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
      - s3
    environment:
      - BHUNTERS_MONGO_URI=mongodb://bhunter:bhunter_dev_pw@mongo:27017/?authSource=admin
      - BHUNTERS_MONGO_DB=b-hunters
      - BHUNTERS_KARTON_CONFIG_PATH=/etc/b-hunters/b-hunters.ini
      - BHUNTERS_AGENT_WORKSPACE_ROOT=/var/lib/b-hunters/workspaces
      - BHUNTERS_SESSION_COOKIE_SECURE=false
      # The key that encrypts the stored credentials.  It has to be the
      # same key in the platform and in the runner: the API never
      # decrypts, the runner does.
      - BHUNTERS_SECRET_KEY=${BHUNTERS_SECRET_KEY:?set BHUNTERS_SECRET_KEY in the environment file}
      - BHUNTERS_RUNNER_CONCURRENCY=${BHUNTERS_RUNNER_CONCURRENCY:-1}
      - BHUNTERS_RUNNER_LEASE_SECONDS=${BHUNTERS_RUNNER_LEASE_SECONDS:-60}
      - BHUNTERS_RUNNER_HEARTBEAT_SECONDS=${BHUNTERS_RUNNER_HEARTBEAT_SECONDS:-10}
      - BHUNTERS_JOB_MAX_ATTEMPTS=${BHUNTERS_JOB_MAX_ATTEMPTS:-3}
      # The model provider.  The runner is the process that talks to it.
      - BHUNTERS_LLM_NAME=${MINIMAX_NAME:-minimax}
      - BHUNTERS_LLM_BASE_URL=${MINIMAX_HOST}
      - BHUNTERS_LLM_API_KEY=${MINIMAX_KEY}
      - BHUNTERS_LLM_MODEL=${MINIMAX_MODEL:-MINIMAX-M3.1-flash}
      - BHUNTERS_LLM_MAX_OUTPUT_TOKENS=8192
      - BHUNTERS_LLM_TIMEOUT=300
      - BHUNTERS_AGENT_VERIFICATION_ENABLED=${BHUNTERS_AGENT_VERIFICATION_ENABLED:-false}
      - BHUNTERS_AGENT_MAX_TOKENS_PER_TASK=1500000
      - BHUNTERS_AGENT_MAX_TOKENS_PER_SCAN=12000000
      - BHUNTERS_AGENT_MAX_TOOL_CALLS_PER_TASK=100
      - BHUNTERS_AGENT_MAX_ROUNDS=24
      - BHUNTERS_AGENT_WALL_CLOCK_SECONDS=1800
      - BHUNTERS_AGENT_MAX_ROLES=${BHUNTERS_AGENT_MAX_ROLES:-4}
      - BHUNTERS_AGENT_JUDGING_BUDGET_SHARE=${BHUNTERS_AGENT_JUDGING_BUDGET_SHARE:-0.3}
      # The workers and the agents each get half of the scan: the
      # workers produced seven findings in ten minutes and the agent
      # roles found the interesting ones in three.
      - BHUNTERS_WORKER_PHASE_SHARE=${BHUNTERS_WORKER_PHASE_SHARE:-0.5}
    # The image's entry point is already `b-hunters`, so the command
    # names the subcommand only.
    command: ["runner"]
    volumes:
      - ./deploy/platform.ini:/etc/b-hunters/b-hunters.ini:ro
      # The agent workspaces are shared with the platform: the API
      # renders the report from the artefacts the runner produced.
      - workspaces:/var/lib/b-hunters
    healthcheck:
      # The runner has no HTTP port.  It reports itself in the database,
      # and this asks it whether its heartbeat is fresh.
      test: ["CMD-SHELL", "b-hunters runner status || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    networks:
      - bhunter

  # --- the data stores -------------------------------------------------
  mongo:
    image: mongo:7.0.16
    container_name: bhunter_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: bhunter
      MONGO_INITDB_ROOT_PASSWORD: bhunter_dev_pw
    volumes:
      - mongo_data:/data/db
    networks:
      - bhunter
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2.5-alpine
    container_name: bhunter_redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - bhunter_dev_pw
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    networks:
      - bhunter
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a bhunter_dev_pw ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  s3:
    image: rustfs/rustfs:latest
    container_name: bhunter_s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: bhunter
      RUSTFS_SECRET_KEY: bhunter_dev_secret
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - s3_data:/data
    networks:
      - bhunter
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # --- the task router --------------------------------------------------
  karton-system:
    image: certpl/karton-system:v5.5.0
    container_name: bhunter_karton
    restart: unless-stopped
    entrypoint: karton-system
    command: --setup-bucket
    volumes:
      - ./deploy/platform.ini:/etc/karton/karton.ini:ro
    depends_on:
      - redis
      - s3
    networks:
      - bhunter

  # --- the Karton dashboard, on the tailnet ------------------------------
  # The dashboard is a second tailnet node, named "karton-dashboard".  It
  # shares its network namespace with the dashboard application, the same
  # way the platform shares its namespace with the "bhunter" node, so the
  # dashboard answers on http://karton-dashboard.<tailnet>.ts.net:5000
  # as well as on the loopback interface of the host.
  tailscale-dashboard:
    <<: *tailscale
    container_name: bhunter_ts_dashboard
    hostname: ${BHUNTER_TS_DASHBOARD_HOSTNAME:-karton-dashboard}
    volumes:
      - ts_dashboard_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    ports:
      # The loopback publication belongs to the container that owns the
      # network namespace; the dashboard application shares it.
      - "127.0.0.1:5000:80"
    networks:
      - bhunter

  karton-dashboard:
    image: b-hunters-local/karton-dashboard:1.0.0
    container_name: bhunter_karton_dashboard
    restart: unless-stopped
    network_mode: service:tailscale-dashboard
    command: ["karton-dashboard", "run", "--host", "0.0.0.0", "--port", "80"]
    volumes:
      - ./deploy/platform.ini:/etc/karton/karton.ini:ro
    depends_on:
      - tailscale-dashboard

  # --- the scanner workers -----------------------------------------------
  # Every worker reads the same configuration and registers under its own
  # Karton identity.
  worker-nuclei:
    image: b-hunters-local/nuclei:1.2.0
    container_name: bhunter_worker_nuclei
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.40

  worker-katana:
    image: b-hunters-local/katana:1.2.0
    container_name: bhunter_worker_katana
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.41

  worker-nmap:
    image: b-hunters-local/nmap:1.2.0
    container_name: bhunter_worker_nmap
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.42

  worker-sqlmap:
    image: b-hunters-local/sqlmap:1.2.0
    container_name: bhunter_worker_sqlmap
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.43

  worker-dalfox:
    image: b-hunters-local/dalfox:1.2.0
    container_name: bhunter_worker_dalfox
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.44

  worker-webtechnology:
    image: b-hunters-local/webtechnology:1.2.0
    container_name: bhunter_worker_webtechnology
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.45

  # The discovery worker.  It is the head of the task chain: it creates the
  # legacy report document and republishes the work as a "subdomain" task,
  # which the crawler turns into the "paths" task the scanners consume.
  # Without it the other workers never receive anything.
  worker-subrecon:
    image: b-hunters-local/subrecon:1.2.0
    container_name: bhunter_worker_subrecon
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.46

  # The remaining scanner workers.  Every one of the seventeen belongs to
  # this stack: the development worker stack runs the same images against a
  # second Karton backend, so a worker that is missing here is missing from
  # the console too.
  worker-dirsearch:
    image: b-hunters-local/dirsearch:1.2.0
    container_name: bhunter_worker_dirsearch
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.47

  worker-paramspider:
    image: b-hunters-local/paramspider:1.2.0
    container_name: bhunter_worker_paramspider
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.48

  worker-gospider:
    image: b-hunters-local/gospider:1.2.0
    container_name: bhunter_worker_gospider
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.49

  worker-wayback:
    image: b-hunters-local/wayback:1.2.0
    container_name: bhunter_worker_wayback
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.50

  worker-getjs:
    image: b-hunters-local/getjs:1.2.0
    container_name: bhunter_worker_getjs
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.51

  worker-jsscanner:
    image: b-hunters-local/jsscanner:1.2.0
    container_name: bhunter_worker_jsscanner
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.52

  worker-ssti:
    image: b-hunters-local/ssti:1.2.0
    container_name: bhunter_worker_ssti
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.53

  # The two slowest scanners.  They are the ones that exceed a short
  # measurement window, so a scan needs a generous duration budget.
  worker-wapiti:
    image: b-hunters-local/wapiti:1.2.0
    container_name: bhunter_worker_wapiti
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.54

  worker-xray:
    image: b-hunters-local/xray:1.2.0
    container_name: bhunter_worker_xray
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.55

  # The screenshot worker.  It drives a real browser at every discovered
  # URL, which is the heaviest of the seventeen against a laboratory
  # application.
  worker-gowitness:
    image: b-hunters-local/gowitness:1.2.0
    container_name: bhunter_worker_gowitness
    restart: unless-stopped
    volumes:
      - ./deploy/b-hunters.ini:/etc/b-hunters/b-hunters.ini:ro
    environment:
      - BHUNTERS_CONFIG=/etc/b-hunters/b-hunters.ini
    depends_on:
      - karton-system
    networks:
      bhunter:
        ipv4_address: 172.25.0.56

  # --- the vulnerable application laboratory -----------------------------
  # These are started with `--profile lab`; they are deliberately not part
  # of the default stack, and they are published on the loopback interface
  # only.
  #
  # Juice Shop is behind a profile of its own: it is the heaviest of the
  # three - it builds a search index in memory and it burns a core of CPU
  # for as long as it is up - and a scan of the other two does not need
  # it.  Start it with `--profile lab --profile juiceshop`.
  lab-dvga:
    image: dolevf/dvga:2.2.0
    container_name: bhunter_lab_dvga
    profiles: ["lab"]
    restart: "no"
    environment:
      WEB_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:5013:5013"
    networks:
      bhunter:
        ipv4_address: 172.25.0.15

  lab-juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: bhunter_lab_juice_shop
    profiles: ["juiceshop"]
    # A full seventeen-worker scan builds a search index in the
    # application, and the Node process can die of it: the target then
    # stays away and the rest of the scan has nothing to look at.  The
    # lab comes back by itself.
    restart: unless-stopped
    environment:
      # The Node.js heap has to be large enough for the search index the
      # application builds.  The index grows with the data the scanners
      # create, so a heap that is comfortable for an idle application is
      # not comfortable for a full seventeen-worker scan: at 6 GB the
      # process died with "Ineffective mark-compacts near heap limit"
      # after a few hours and took the target away mid-scan.
      NODE_OPTIONS: "--max-old-space-size=12288"
    ports:
      - "127.0.0.1:3300:3000"
    mem_limit: 16g
    networks:
      bhunter:
        ipv4_address: 172.25.0.13

  lab-webgoat:
    image: webgoat/webgoat:latest
    container_name: bhunter_lab_webgoat
    profiles: ["lab"]
    restart: "no"
    ports:
      - "127.0.0.1:8081:8080"
    # The image's own healthcheck calls curl, which the image does not
    # have: the container was reported unhealthy for months while the
    # application served normally.  The image has bash, and bash can
    # open a TCP connection, so the healthcheck is a TCP request.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /WebGoat/ HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q HTTP'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      bhunter:
        ipv4_address: 172.25.0.14

volumes:
  mongo_data:
  redis_data:
  s3_data:
  ts_bhunter_data:
  ts_dashboard_data:
  workspaces:

networks:
  bhunter:
    name: bhunter
    driver: bridge
