; The B-Hunters platform configuration.
;
; The platform and the scanner workers read the same file, so the
; infrastructure is addressed by container name.
;
; The `[karton] identity` option is deliberately absent: Karton's
; configuration overrides a worker's class-level identity, so naming an
; identity here would make every worker register under the same name.
; Each worker uses its own identity instead.

[redis]
host = redis
port = 6379
password = bhunter_dev_pw
db = 0

[minio]
access_key = bhunter
secret_key = bhunter_dev_secret
address = http://s3:9000
secure = 0

[s3]
access_key = bhunter
secret_key = bhunter_dev_secret
address = http://s3:9000
bucket = bhunters

[mongo]
user = bhunter
password = bhunter_dev_pw
db = b-hunters
host = mongo
port = 27017

; The webhook section is optional: a worker without it skips the
; notification instead of raising.
[Webhook]
discord_report =
discord_task_status =
