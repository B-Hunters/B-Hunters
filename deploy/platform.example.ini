; The B-Hunters **platform** configuration.
;
; This file is used by the platform itself and by the Karton task router.
; It differs from the worker configuration (`b-hunters.ini`) in one place:
; the platform names a Karton identity, because the router and the
; platform need to be identifiable in the queue.  The workers must *not*
; name one - a shared identity would make every worker compete for the
; same queue and overwrite each other's status records.
;
; This is the **example**.  The real file is written from the
; environment by `scripts/render_config.py` and is not in the
; repository: a configuration file with a password in it is a password
; in the repository.

[karton]
identity = B-Hunters-Platform

[redis]
host = {{BHUNTERS_REDIS_HOST}}
port = {{BHUNTERS_REDIS_PORT}}
password = {{BHUNTERS_REDIS_PASSWORD}}
db = 0

[minio]
access_key = {{BHUNTERS_S3_ACCESS_KEY}}
secret_key = {{BHUNTERS_S3_SECRET_KEY}}
address = {{BHUNTERS_S3_ENDPOINT}}
secure = 0

[s3]
access_key = {{BHUNTERS_S3_ACCESS_KEY}}
secret_key = {{BHUNTERS_S3_SECRET_KEY}}
address = {{BHUNTERS_S3_ENDPOINT}}
bucket = {{BHUNTERS_S3_BUCKET}}

[mongo]
user = {{BHUNTERS_MONGO_USER}}
password = {{BHUNTERS_MONGO_PASSWORD}}
db = {{BHUNTERS_MONGO_DB}}
host = {{BHUNTERS_MONGO_HOST}}
port = {{BHUNTERS_MONGO_PORT}}

[Webhook]
discord_report =
discord_task_status =
