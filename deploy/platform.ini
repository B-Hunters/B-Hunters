; The B-Hunters **platform** configuration.
;
; This file is used by the platform itself and by the Karton task router.
; It differs from the worker configuration (`b-hunters.ini`) in one place:
; the platform names a Karton identity, because the router and the
; platform need to be identifiable in the queue.  The workers must *not*
; name one - a shared identity would make every worker compete for the
; same queue and overwrite each other's status records.

[karton]
identity = B-Hunters-Platform

[redis]
host = redis
port = 6379
password = bhunter_dev_pw
db = 0

[minio]
access_key = bhunter
secret_key = bhunter_dev_secret
address = http://s3:9000
secure = 0

[s3]
access_key = bhunter
secret_key = bhunter_dev_secret
address = http://s3:9000
bucket = bhunters

[mongo]
user = bhunter
password = bhunter_dev_pw
db = b-hunters
host = mongo
port = 27017

[Webhook]
discord_report =
discord_task_status =
