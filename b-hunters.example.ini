; The B-Hunters configuration.
;
; The placeholders below are deliberately not values: a password that
; looks like a password gets copied into a deployment and becomes one.
; The deployment's own configuration is written from the environment by
; `scripts/render_config.py`.

[redis]
host=<redis-host>
port=6379
password=<redis-password>

[s3]
access_key=<s3-access-key>
secret_key=<s3-secret-key>
address=<s3-address>
bucket=<s3-bucket>

[mongo]
user=<mongo-user>
password=<mongo-password>
db=b-hunters
host=<mongo-host>
port=27017

[Webhook]
discord_report=
discord_task_status=
