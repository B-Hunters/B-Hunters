name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip ruff
      - name: Ruff lint
        run: ruff check b_hunters tests
      - name: Ruff format check
        run: ruff format --check b_hunters tests

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip mypy types-requests
      - name: Install the package
        run: pip install -e ".[platform]"
      - name: MyPy
        run: mypy b_hunters/platform --ignore-missing-imports --no-strict-optional

  unit-tests:
    name: Unit and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[platform]"
      - name: Run the tests that need no services
        run: pytest tests/unit tests/security -q

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the console tests
        run: node --test tests/frontend/

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.16
        ports: ["27017:27017"]
        env:
          MONGO_INITDB_ROOT_USERNAME: bhunter
          MONGO_INITDB_ROOT_PASSWORD: bhunter_ci_pw
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.2.5-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BHUNTERS_TEST_MONGO_URI: mongodb://bhunter:bhunter_ci_pw@127.0.0.1:27017/?authSource=admin
      BHUNTERS_TEST_MONGO_DB: b-hunters-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[platform]"
      - name: Run the full suite
        run: pytest tests -q

  package:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip build twine
      - name: Build
        run: python -m build
      - name: Check the metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Build and scan the image
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: b-hunters-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: b-hunters-platform:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
